<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lead Admin</title><style>
:root{--ink:#172033;--muted:#667085;--line:#e4e7ec;--canvas:#f7f8fc;--primary:#3157d5;--danger:#b42318}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--canvas);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.shell{width:min(1200px,calc(100% - 2rem));margin:auto}header{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:1rem}h1{font-size:1.25rem}.subtle,.notice{color:var(--muted)}button,input,select{font:inherit}button{border:0;border-radius:8px;padding:.65rem .95rem;font-weight:650;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.primary{background:var(--primary);color:#fff}.secondary{background:#e9edff;color:#2949b5}.quiet{background:transparent;color:#344054}.toolbar{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:1.5rem 0}.toolbar>div,.header-actions{display:flex;gap:.65rem;flex-wrap:wrap}.panel,.distribution,.status-warning{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.25rem}.project-header{display:flex;align-items:start;justify-content:space-between;gap:1rem}.project-header h2,.dashboard-summary h2,.lead-data h2,.distribution h3,.status-warning h3{margin-top:0}.project-header p{margin:.18rem 0}.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}.project-card{text-align:left;padding:1.15rem;background:#fff;border:1px solid var(--line);border-radius:12px}.project-card:hover,.project-card:focus-visible{border-color:var(--primary);outline:3px solid #b9c7ff}.project-card h3{margin:.1rem 0}.project-card p{color:var(--muted);margin:.25rem 0;overflow-wrap:anywhere}.error{padding:.75rem 1rem;background:#fef3f2;color:var(--danger);border-radius:8px}.empty{padding:2rem 1rem;text-align:center;color:var(--muted)}label{display:block;font-weight:650;margin:1rem 0 .35rem}input,select{width:100%;border:1px solid #cfd4dc;border-radius:8px;padding:.65rem .75rem;background:#fff}.choice-list{border:1px solid var(--line);border-radius:8px;max-height:210px;overflow:auto;margin-top:.5rem}.choice{width:100%;text-align:left;border-radius:0;background:#fff;border-bottom:1px solid var(--line);font-weight:500}.choice[aria-pressed="true"]{background:#edf1ff;color:#203d9d;font-weight:700}.form-actions{display:flex;justify-content:flex-end;gap:.65rem;margin-top:1.25rem}.modal-backdrop{position:fixed;inset:0;background:#10182888;display:grid;place-items:center;padding:1rem;z-index:2}.modal{width:min(650px,100%);max-height:calc(100vh - 2rem);overflow:auto;background:#fff;border-radius:14px;padding:1.25rem}.modal-head{display:flex;justify-content:space-between;gap:1rem}.dashboard-summary{margin:1.5rem 0}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:.75rem}.metric{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1rem}.metric-primary{border:2px solid var(--primary);background:#f3f6ff}.metric strong{display:block;font-size:1.6rem}.metric span{color:var(--muted);font-size:.9rem}.metric p{margin:.2rem 0 0}.distribution,.status-warning{margin:1.5rem 0}.distribution-row{display:grid;grid-template-columns:minmax(100px,180px) minmax(90px,1fr) 100px;gap:.75rem;align-items:center;margin:.7rem 0}.distribution-label{font-weight:650;overflow-wrap:anywhere}.distribution-track{height:.7rem;background:#e7eafb;border-radius:99px;overflow:hidden}.distribution-bar{height:100%;min-width:2px;background:var(--primary);border-radius:99px}.distribution-value{text-align:right;color:var(--muted);font-size:.88rem}.lead-controls{margin:1rem 0}.lead-controls input,.lead-controls select{width:auto;min-width:190px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;min-width:max-content;border-collapse:collapse;background:#fff}th,td{max-width:300px;padding:.7rem .85rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}th{background:#f8f9fc;font-size:.82rem}td select{width:100%;min-width:140px;max-width:220px}tr.row-updating{opacity:.65}tr.row-updating select{cursor:wait}@media(max-width:600px){.shell{width:calc(100% - 1rem)}.toolbar>div,.header-actions{width:100%}.toolbar button,.header-actions button{flex:1}.panel,.distribution,.status-warning{padding:1rem}.project-header{display:block}.distribution-row{grid-template-columns:1fr}.distribution-value{text-align:left}.lead-controls input,.lead-controls select{width:100%}}
</style></head><body><div class="shell"><header><h1>Lead Admin</h1><div><button id="login" class="primary" type="button">Sign in with Google</button><button id="logout" class="quiet" type="button" hidden>Sign out</button></div></header><p id="status" class="notice" role="status"></p><main id="app" hidden></main></div><script src="/app.js" defer></script></body></html>
